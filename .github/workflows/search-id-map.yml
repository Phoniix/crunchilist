# Crunchilist Search: rebuilds search/feeds/id-map.json, the master list, every week from open data
# (anime-offline-database, ODbL; Wikidata, CC0). No secrets needed. The anime-offline-database releases on
# Mondays, so this runs Tuesday. A failed health check fails the job and the published feed stays live.
# It commits back to the branch it ran on. GitHub only runs schedules and the Run button from the default
# branch, so while Crunchilist Search lives on the "search" branch the job runs when its own code is pushed there.
name: Crunchilist Search id map

on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:
  push:
    branches: [search]
    paths: ["search/scripts/id-map.mjs", "search/src/lib/id-map.js", ".github/workflows/search-id-map.yml"]

permissions:
  contents: write

concurrency:
  group: search-id-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the master list
        run: node search/scripts/id-map.mjs
      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain -- search/feeds)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add search/feeds
          git commit -m "Crunchilist Search id map: weekly refresh"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          exit 1

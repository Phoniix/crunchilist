# Rebuilds feeds/youtube.json every week: free, complete, official YouTube uploads matched to AniList.
# Needs a repository secret named YOUTUBE_API_KEY (a YouTube Data API v3 key; a run uses a few thousand of its
# 10,000 free daily units). The extension reads the feed from master, so a change reaches users within 12 hours.
name: YouTube catalog

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the feed
        run: node scripts/youtube-catalog.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain -- feeds)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add feeds
          git commit -m "YouTube catalog: weekly refresh"
          # master can move during a long run; on a feeds/ conflict this run's freshly built files win.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin master && git push && exit 0
            sleep 10
          done
          exit 1

      <stop offset="100%" stop-color="#e4e0ea"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd0ff"/>
      <stop offset="40%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#1a48b8"/>
    </linearGradient>
    <radialGradient id="bl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fab" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#ff8fab" stop-opacity="0"/>

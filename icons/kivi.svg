<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="840" height="1040" role="img" aria-label="Kivi">
  <title>Kivi</title>
  <defs>
    <linearGradient id="sk" x1="140" y1="70" x2="300" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe9de"/>
      <stop offset="60%" stop-color="#f0c4a8"/>
      <stop offset="100%" stop-color="#dfa088"/>
    </linearGradient>
    <linearGradient id="skS" x1="210" y1="100" x2="320" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8b49a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c88870" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="hd" x1="210" y1="10" x2="210" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d353c"/>
      <stop offset="35%" stop-color="#241e24"/>
      <stop offset="100%" stop-color="#100e12"/>
    </linearGradient>
    <linearGradient id="hb" x1="210" y1="150" x2="210" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ec0ff"/>
      <stop offset="45%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#1f5ad0"/>

  <path fill="#f4f2f7" d="M200 290v180h8V290z" opacity=".7"/>
  <circle cx="204" cy="340" r="3.4" fill="#cfcbd6"/>
  <circle cx="204" cy="372" r="3.4" fill="#cfcbd6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="512" height="512" role="img" aria-label="Kivi v1">
  <title>Kivi - soft bust (v1)</title>
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2550"/>
      <stop offset="100%" stop-color="#15132a"/>
    </linearGradient>
    <linearGradient id="hair1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c8ff"/>
      <stop offset="55%" stop-color="#a99cff"/>
      <stop offset="100%" stop-color="#7b6fd4"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8dc"/>
      <stop offset="100%" stop-color="#f5c9b0"/>
    </linearGradient>
    <radialGradient id="cheek1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fab" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff8fab" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#sky1)"/>
  <!-- faint globe -->
  <circle cx="80" cy="78" r="52" fill="none" stroke="#eef0ff" stroke-width="1.2" opacity=".18"/>
  <ellipse cx="80" cy="78" rx="20" ry="52" fill="none" stroke="#eef0ff" stroke-width=".9" opacity=".14"/>
  <!-- back hair -->
  <path fill="url(#hair1)" d="M38 78c2-36 22-54 42-54s40 18 42 54c0 28-8 46-14 54H52c-6-8-14-26-14-54z"/>
  <!-- neck + shoulders -->
  <path fill="url(#skin1)" d="M68 112c2 10 6 18 12 18s10-8 12-18v-6H68z"/>
  <path fill="#4fd1ff" d="M42 148c8-18 22-28 38-28s30 10 38 28H42z"/>
  <path fill="#a99cff" opacity=".85" d="M52 138c6-8 14-12 28-12s22 4 28 12c-8 6-18 10-28 10s-20-4-28-10z"/>
  <!-- face -->
  <ellipse cx="80" cy="78" rx="28" ry="32" fill="url(#skin1)"/>
  <!-- bangs -->
  <path fill="url(#hair1)" d="M52 62c6-22 18-30 28-30 8 0 18 6 24 18 2 4-2 8-6 6-6-2-10-8-14-6-4 2-6 10-10 10s-8-6-12-8c-4-2-10 2-10 10z"/>
  <path fill="url(#hair1)" d="M54 70c-2-10 4-22 12-26 2 8 2 16-2 24-2 4-8 6-10 2z"/>
  <path fill="url(#hair1)" d="M106 70c2-10-4-22-12-26-2 8-2 16 2 24 2 4 8 6 10 2z"/>
  <!-- side locks -->
  <path fill="url(#hair1)" d="M48 78c-4 18-2 36 4 48 4 2 8-2 8-8 0-12-2-24-2-36 0-4-6-6-10-4z"/>
  <path fill="url(#hair1)" d="M112 78c4 18 2 36-4 48-4 2-8-2-8-8 0-12 2-24 2-36 0-4 6-6 10-4z"/>
  <!-- eyes -->
  <ellipse cx="68" cy="82" rx="7.5" ry="9" fill="#fff"/>
  <ellipse cx="92" cy="82" rx="7.5" ry="9" fill="#fff"/>
  <ellipse cx="69" cy="84" rx="4.2" ry="5.5" fill="#3d4fd4"/>
  <ellipse cx="93" cy="84" rx="4.2" ry="5.5" fill="#3d4fd4"/>
  <ellipse cx="70.2" cy="85.2" rx="2" ry="2.6" fill="#12122a"/>
  <ellipse cx="94.2" cy="85.2" rx="2" ry="2.6" fill="#12122a"/>
  <circle cx="71.5" cy="81.5" r="1.3" fill="#fff"/>
  <circle cx="95.5" cy="81.5" r="1.3" fill="#fff"/>
  <!-- lashes / line -->
  <path d="M60 78c3-4 10-5 16-2" fill="none" stroke="#2a2040" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M84 76c3-4 10-5 16-2" fill="none" stroke="#2a2040" stroke-width="1.6" stroke-linecap="round"/>
  <!-- brows -->
  <path d="M60 70c4-3 12-3 16 0" fill="none" stroke="#7b6fd4" stroke-width="2" stroke-linecap="round"/>
  <path d="M84 70c4-3 12-3 16 0" fill="none" stroke="#7b6fd4" stroke-width="2" stroke-linecap="round"/>
  <!-- nose + mouth -->
  <path d="M80 90c0 3 2 4 0 5" fill="none" stroke="#d4a090" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M74 100c4 4 8 4 12 0" fill="none" stroke="#c07080" stroke-width="1.8" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="60" cy="94" rx="7" ry="4" fill="url(#cheek1)"/>
  <ellipse cx="100" cy="94" rx="7" ry="4" fill="url(#cheek1)"/>
  <!-- cyan trail pin -->
  <path d="M118 48L132 34" stroke="#4fd1ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="132" cy="34" r="4" fill="#4fd1ff"/>
</svg>

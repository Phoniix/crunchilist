<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="512" height="512" role="img" aria-label="Kivi v5">
  <title>Kivi - clean app icon (v5)</title>
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2754"/>
      <stop offset="100%" stop-color="#141228"/>
    </linearGradient>
    <linearGradient id="hair5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd0ff"/>
      <stop offset="60%" stop-color="#a99cff"/>
      <stop offset="100%" stop-color="#6f64c4"/>
    </linearGradient>
    <linearGradient id="skin5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8dc"/>
      <stop offset="100%" stop-color="#f0c0a4"/>
    </linearGradient>
    <clipPath id="tile5"><rect width="160" height="160" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#tile5)">
    <rect width="160" height="160" fill="url(#sky5)"/>
    <!-- brand frame echo -->
    <rect x="10" y="10" width="140" height="140" rx="28" fill="none" stroke="#a99cff" stroke-width="3" opacity=".45"/>
    <!-- back hair mass -->
    <path fill="url(#hair5)" d="M28 86c6-44 28-66 52-66s46 22 52 66c0 40-12 70-20 80H48c-8-10-20-40-20-80z"/>
    <!-- torso crop -->
    <path fill="#4fd1ff" d="M30 160c12-32 30-46 50-46s38 14 50 46H30z"/>
    <path fill="#1a1830" d="M48 160c8-20 20-30 32-30s24 10 32 30H48z"/>
    <path fill="#a99cff" d="M70 128h20v32H70z" opacity=".9"/>
    <!-- neck -->
    <path fill="url(#skin5)" d="M70 112c3 12 8 20 12 20s9-8 12-20l-2-8H72z"/>
    <!-- face -->
    <ellipse cx="82" cy="78" rx="32" ry="36" fill="url(#skin5)"/>
    <!-- hair crown + bangs -->
    <path fill="url(#hair5)" d="M50 72c2-34 18-52 32-52 16 0 32 18 34 52-4-2-6-8-6-14 0-12-8-22-18-24-8-2-16 4-20 12-2 4-6 6-10 4-6-2-10 6-12 14-2 4-6 8-0 8z"/>
    <path fill="url(#hair5)" d="M50 78c-2 0-6-4-4-12 4-16 12-28 22-32-2 10-4 22-8 32-2 6-6 10-10 12z"/>
    <path fill="url(#hair5)" d="M114 78c2 0 6-4 4-12-4-16-12-28-22-32 2 10 4 22 8 32 2 6 6 10 10 12z"/>
    <!-- face-framing strands -->
    <path fill="url(#hair5)" d="M48 84c-4 20-2 40 4 54 4 2 8-2 8-8-2-14-2-28 0-40 0-4-6-8-12-6z"/>
    <path fill="url(#hair5)" d="M116 84c4 20 2 40-4 54-4 2-8-2-8-8 2-14 2-28 0-40 0-4 6-8 12-6z"/>
    <!-- eyes -->
    <path d="M58 74c2-6 10-10 18-8 4 1 6 4 6 8 0 8-6 14-12 14s-12-6-12-14z" fill="#fff"/>
    <path d="M82 74c2-6 10-10 18-8 4 1 6 4 6 8 0 8-6 14-12 14s-12-6-12-14z" fill="#fff"/>
    <ellipse cx="68" cy="80" rx="5" ry="6.5" fill="#3f4fd8"/>
    <ellipse cx="92" cy="80" rx="5" ry="6.5" fill="#3f4fd8"/>
    <ellipse cx="69" cy="81.5" rx="2.4" ry="3.2" fill="#12122a"/>
    <ellipse cx="93" cy="81.5" rx="2.4" ry="3.2" fill="#12122a"/>
    <circle cx="70.5" cy="77.5" r="1.5" fill="#fff"/>
    <circle cx="94.5" cy="77.5" r="1.5" fill="#fff"/>
    <!-- upper lash -->
    <path d="M58 74c4-4 12-6 20-2" fill="none" stroke="#241838" stroke-width="2" stroke-linecap="round"/>
    <path d="M82 74c4-4 12-6 20-2" fill="none" stroke="#241838" stroke-width="2" stroke-linecap="round"/>
    <!-- brows -->
    <path d="M58 66c5-3 14-4 20 0" fill="none" stroke="#8a7cd4" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M82 66c5-3 14-4 20 0" fill="none" stroke="#8a7cd4" stroke-width="2.2" stroke-linecap="round"/>
    <!-- nose mouth -->
    <path d="M82 90c1 3 0 5-1 5" fill="none" stroke="#d4a090" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M74 100c5 5 11 5 16 0" fill="none" stroke="#c07080" stroke-width="2" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="56" cy="92" rx="8" ry="4.5" fill="#ff8fab" opacity=".4"/>
    <ellipse cx="108" cy="92" rx="8" ry="4.5" fill="#ff8fab" opacity=".4"/>
    <!-- cyan trail like logo -->
    <path d="M118 42L138 24" stroke="#4fd1ff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="138" cy="24" r="4.5" fill="#4fd1ff"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="512" height="512" role="img" aria-label="Kivi v3">
  <title>Kivi - traveler profile (v3)</title>
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241f48"/>
      <stop offset="100%" stop-color="#12101f"/>
    </linearGradient>
    <linearGradient id="hair3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe8ff"/>
      <stop offset="40%" stop-color="#b6a6ff"/>
      <stop offset="100%" stop-color="#6e62c8"/>
    </linearGradient>
    <linearGradient id="skin3" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0%" stop-color="#ffe9de"/>
      <stop offset="100%" stop-color="#e8b498"/>
    </linearGradient>
    <linearGradient id="coat3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3560"/>
      <stop offset="100%" stop-color="#1e1a38"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#sky3)"/>
  <!-- meridian behind -->
  <circle cx="78" cy="72" r="48" fill="none" stroke="#eef0ff" stroke-width="1.4" opacity=".2"/>
  <ellipse cx="78" cy="72" rx="18" ry="48" fill="none" stroke="#eef0ff" stroke-width="1" opacity=".16"/>
  <path d="M40 88L108 48" stroke="#4fd1ff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <circle cx="108" cy="48" r="3.5" fill="#4fd1ff"/>
  <!-- coat / shoulders 3/4 -->
  <path fill="url(#coat3)" d="M36 150c6-28 18-42 36-48 4 8 12 14 20 14 6 0 12-4 16-10 14 8 24 24 28 44H36z"/>
  <path fill="#4fd1ff" opacity=".9" d="M72 108c8 6 20 6 28-2l2 8c-8 8-22 10-34 2z"/>
  <!-- neck -->
  <path fill="url(#skin3)" d="M78 100c4 12 10 18 14 18 2 0 4-4 4-10v-10h-18z"/>
  <!-- face 3/4 -->
  <ellipse cx="86" cy="72" rx="26" ry="30" fill="url(#skin3)"/>
  <!-- ear -->
  <ellipse cx="62" cy="76" rx="5" ry="7" fill="url(#skin3)"/>
  <!-- hair back -->
  <path fill="url(#hair3)" d="M58 70c-2-30 16-48 36-48 14 0 28 10 32 30 2 12 0 28-6 40-4 2-8-2-8-8 2-10 2-20 0-28-4-14-14-22-26-22-16 0-26 12-28 30-2 4-8 6-10 2 0-8 2-18 10-26z"/>
  <!-- side sweep -->
  <path fill="url(#hair3)" d="M58 78c-6 16-4 36 2 48 4 2 8-2 8-8-2-12-2-24 0-34 0-4-6-8-10-6z"/>
  <path fill="url(#hair3)" d="M112 70c6 12 8 30 4 46-4 2-8 0-8-6 2-12 0-26-2-36 0-4 4-6 6-4z"/>
  <!-- bangs across brow -->
  <path fill="url(#hair3)" d="M64 58c6-18 18-26 30-24 10 2 18 10 22 22 2 4-2 6-6 4-8-4-12-12-18-10-6 2-8 10-14 10-4 0-8-6-12-8-4-2-8 2-2 6z"/>
  <!-- eye (visible) -->
  <ellipse cx="92" cy="76" rx="8" ry="9.5" fill="#fff"/>
  <ellipse cx="93.5" cy="78" rx="4.5" ry="5.8" fill="#4656e0"/>
  <ellipse cx="94.5" cy="79.5" rx="2.2" ry="2.8" fill="#101028"/>
  <circle cx="96" cy="75.5" r="1.4" fill="#fff"/>
  <path d="M84 72c3-4 12-5 18-1" fill="none" stroke="#2a2040" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M84 66c5-3 14-3 18 1" fill="none" stroke="#7b6fd4" stroke-width="2" stroke-linecap="round"/>
  <!-- far eye hint -->
  <ellipse cx="74" cy="78" rx="3.5" ry="5" fill="#fff" opacity=".9"/>
  <ellipse cx="74.5" cy="79" rx="1.8" ry="2.8" fill="#4656e0"/>
  <!-- nose mouth -->
  <path d="M98 88c2 2 0 5-2 5" fill="none" stroke="#d4a090" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M90 98c4 3 10 3 12-1" fill="none" stroke="#c07080" stroke-width="1.7" stroke-linecap="round"/>
  <ellipse cx="78" cy="90" rx="5" ry="3" fill="#ff8fab" opacity=".35"/>
  <!-- hair clip / star -->
  <path fill="#4fd1ff" d="M70 48l2.2 4.4 4.8.6-3.6 3.4.9 4.8L70 59l-4.3 2.2.9-4.8-3.6-3.4 4.8-.6z"/>
</svg>
